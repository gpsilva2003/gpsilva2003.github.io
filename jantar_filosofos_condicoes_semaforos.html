<script id="simulation-engine">class StateDiningSimulation {
  constructor(mode = 'condition') { this.reset(mode); }

  reset(mode = this.mode) {
    if (!['condition', 'semaphore'].includes(mode)) throw new Error('Invalid mode');
    this.mode = mode;
    this.mutex = null;
    this.permits = Array(5).fill(0);
    this.conditionWaiters = Array(5).fill(false);
    this.tick = 0;
    this.cursor = 0;
    this.seed = 2026;
    this.maxEating = 0;

const $=id=>document.getElementById(id);

const colours=['#3675ba','#ad6a39','#7c5eae','#0d8a78','#b14f70'];
const logicalKey=person=>'logical'+person.logical[0].toUpperCase()+person.logical.slice(1);
function stop(){clearTimeout(timer);timer=null;playing=false;}
function reset(){stop();simulation.reset();selected=0;note=null;render();}
function threadText(person){
  if(person.waiting==='condition')return t('queueCondition');
  if(person.waiting==='semaphore')return t('queueSemaphore');
  if(person.waiting==='reacquire')return t('reacquire');
  if(person.waiting==='mutex')return t('waitMutex');
  if(person.semGranted)return t('privatePermit');
  return t(person.phase);
}
function blockedReason(person){if(person.waiting==='mutex'||person.waiting==='reacquire')return t('blockedMutex',simulation.mutex);return t(person.waiting==='condition'?'blockedCondition':'blockedSemaphore');}
function stateOf(person){
  if(person.waiting&&!simulation.canStep(person.id))return 'waiting';
  if(person.logical==='eating'&&person.phase!=='eating'&&person.phase!=='releasing')return 'authorized';
  if(person.phase==='requesting'&&person.logical==='hungry')return 'hungry';
  return person.phase;
}
function act(id){if(!simulation.canStep(id))return;selected=id;simulation.step(id);note=null;render();}
function advance(){const id=$('scheduler').value==='manual'?selected:simulation.choose($('scheduler').value);if(id===null){stop();render();return;}act(id);}
function loop(){if(!playing)return;advance();if(playing)timer=setTimeout(loop,Number($('speed').value));}
function setLanguage(value){
 lang=value;document.documentElement.lang=value==='pt'?'pt-BR':value;document.title=t('title');
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===lang)));
 document.querySelector('.languages').setAttribute('aria-label',t('language'));render();
}
function codeLines(){
 const cond=simulation.mode==='condition';
 const lines=[['','// '+t(cond?'initialCondition':'initialSemaphore')],['','pensar(i);'],['thinkStart','// '+t('requesting')],['lockRequest','pthread_mutex_lock(&M);'],['setHungry','estado[i] = COM_FOME;'],['testSelf','tentar_liberar(i);']];
 if(cond)lines.push(['checkCondition','while (estado[i] != COMENDO) {'],['condWait','  pthread_cond_wait(&pode_comer[i], &M);'],['','}'],['unlockRequest','pthread_mutex_unlock(&M);']);
 else lines.push(['unlockRequest','pthread_mutex_unlock(&M);'],['semWait','sem_wait(&permissao[i]);']);
 lines.push(['eat','faz_refeicao(i);'],['lockRelease','pthread_mutex_lock(&M);'],['setThinking','estado[i] = PENSANDO;'],['testLeft','tentar_liberar((i + N - 1) % N);'],['testRight','tentar_liberar((i + 1) % N);'],['unlockRelease','pthread_mutex_unlock(&M);'],['thinkEnd','// '+t('thinking')+' → ...']);return lines;

}
function eventText(event){
 const keys={request:'eventRequest',lock:'eventLock',waitMutex:'eventWaitMutex',reacquired:'eventReacquired',hungry:'eventHungry',grant:'eventGrant',deny:'eventDeny',skip:'eventSkip',check:'eventCheck',condWait:'eventCondWait',unlock:'eventUnlock',semWait:'eventSemWait',semBlocked:'eventSemBlocked',semResume:'eventSemResume',eat:'eventEat',thinking:'eventThinking',think:'eventThink',spurious:'eventSpurious'};
 return t(keys[event.kind],event.id,event.kind==='waitMutex'?event.owner:event.target);
}
function grantDetail(event){return event.kind==='grant'?t(event.notify==='signal'?(event.woke?'signalWake':'signalEmpty'):(event.woke?'postWake':'postStored'),event.target):'';}
function render(){
 const person=simulation.people[selected],manual=$('scheduler').value==='manual',runnable=simulation.canStep(selected);
 $('ticks').textContent=simulation.tick;$('meals').textContent=simulation.people.reduce((sum,p)=>sum+p.meals,0);$('peak').textContent=simulation.maxEating;
 $('mutex-tag').textContent='M: '+(simulation.mutex===null?t('free'):'P'+simulation.mutex);
 document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===simulation.mode)));
 $('play').textContent=t(playing?'pause':'play');$('play').disabled=manual;$('step').disabled=manual&&!runnable;$('person-step').disabled=!manual||!runnable;
 $('person-step').textContent=t('runPerson',selected);$('person-step').title=!runnable?blockedReason(person):manual?'':t('selectionTip');$('step').title=manual&&!runnable?blockedReason(person):'';
 $('spurious-control').hidden=simulation.mode!=='condition';$('spurious').disabled=!simulation.conditionWaiters[selected];$('spurious').textContent=t('spurious',selected);
 $('people-buttons').innerHTML=simulation.people.map(p=>'<button type="button" data-person="'+p.id+'" aria-pressed="'+(p.id===selected)+'">P'+p.id+'</button>').join('');
 $('reservation').textContent=person.logical==='eating'?t('reservation',selected,simulation.right(selected)):t('noReservation');
 $('neighbors').textContent=t('neighbors',selected,simulation.left(selected),simulation.right(selected));$('person-logical').textContent=t(logicalKey(person));$('person-state').textContent=threadText(person);
 $('state-rows').innerHTML=simulation.people.map(p=>'<tr class="'+(selected===p.id?'selected':'')+'"><td><b>P'+p.id+'</b></td><td><span class="logical-state '+p.logical+'">'+escapeHTML(t(logicalKey(p)))+'</span></td><td><span class="thread-state">'+escapeHTML(threadText(p))+'</span></td><td><span class="mechanism-state">'+escapeHTML(privateText(p))+'</span></td></tr>').join('');
 $('mechanism-caption').textContent=t(simulation.mode==='condition'?'mechanismCondCaption':'mechanismSemCaption');
 $('lesson-text').textContent=t(simulation.mode==='condition'?'condLesson':'semLesson');
 const reacquire=simulation.people.some(p=>p.waiting==='reacquire'),privateWait=simulation.people.some(p=>['condition','semaphore'].includes(p.waiting)),authorized=simulation.people.some(p=>p.logical==='eating'&&p.phase!=='eating'&&p.phase!=='releasing');
 $('status').className='status-banner'+(reacquire||privateWait?' warning':'');
 $('status-title').textContent=t(reacquire?'wakeTitle':privateWait?'outsideTitle':authorized?'activity':playing?'running':'paused');
 $('status-description').textContent=t(reacquire?'wakeDesc':privateWait?'outsideDesc':authorized?'activityDesc':'readyDesc');
 $('scenario-note').hidden=!note;if(note)$('scenario-note').textContent=t(note.key,...(note.args||[]));
 $('log').innerHTML=simulation.history.length?simulation.history.slice(-40).reverse().map(event=>'<li class="'+event.kind+'"><span class="tick">#'+event.tick+'</span><span>'+escapeHTML(eventText(event))+(event.kind==='grant'?'<span class="event-detail">'+escapeHTML(grantDetail(event))+'</span>':'')+'</span></li>').join(''):'<li>'+escapeHTML(t('logEmpty'))+'</li>';
 renderCode();renderTable();
}
function drive(id,predicate){for(let n=0;n<30;n++){if(!simulation.canStep(id))throw Error('Scenario thread is blocked');const event=simulation.step(id);if(predicate(simulation.people[id],event))return;}throw Error('Scenario did not finish');}
function prepareScenario(){
 stop();simulation.reset();selected=0;const scenario=$('scenario').value,cond=simulation.mode==='condition';
 if(scenario==='reservation'){drive(0,p=>p.logical==='eating');note={key:cond?'reservationCond':'reservationSem'};}
 else if(scenario==='parallel'){for(const id of [0,2])drive(id,p=>p.phase==='eating');selected=2;note={key:'parallelNote'};}
 else {drive(0,p=>p.phase==='eating');drive(1,p=>p.waiting===(cond?'condition':'semaphore'));selected=1;
   if(scenario==='notification'){drive(0,(_,event)=>event.kind==='grant'&&event.target===1);note={key:cond?'notifyCondNote':'notifySemNote'};}
   else note={key:cond?'waitCondNote':'waitSemNote'};
 }render();
}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.lang)));
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{stop();simulation.reset(button.dataset.mode);selected=0;note=null;render();}));
$('scheduler').addEventListener('change',()=>{stop();render();});$('speed').addEventListener('input',()=>{$('speed-value').textContent=$('speed').value+' ms';});
$('play').addEventListener('click',()=>{if(playing){stop();render();}else{playing=true;loop();}});$('step').addEventListener('click',()=>{stop();advance();});$('reset').addEventListener('click',reset);$('person-step').addEventListener('click',()=>{stop();act(selected);});$('prepare').addEventListener('click',prepareScenario);
$('spurious').addEventListener('click',()=>{stop();if(simulation.spuriousWake(selected)){note={key:'spuriousNote',args:[selected]};render();}});
function selectPerson(event){const element=event.target.closest('[data-person]');if(element){selected=Number(element.dataset.person);render();}}
$('table').addEventListener('click',selectPerson);$('table').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPerson(event);}});$('people-buttons').addEventListener('click',selectPerson);
window.addEventListener('pagehide',stop);setLanguage('pt');
</script><script data-mobile-visual>

  function refresh(){const words=labels[document.documentElement.lang.slice(0,2)]||labels.pt;button.textContent=words[region.dataset.zoomed==='true'?0:1];button.setAttribute('aria-expanded',String(region.dataset.zoomed==='true'));region.setAttribute('aria-label',region.dataset.zoomed==='true'?words[2]:(svg.getAttribute('aria-label')||words[2]));hint.hidden=region.dataset.zoomed!=='true';}
