<script id="simulation-engine">class DiningSimulation {
  constructor(strategy='naive',scope='meal'){this.reset(strategy,scope);}
  reset(strategy=this.strategy,scope=this.scope){
    if(!['naive','central','ordered'].includes(strategy)||!['meal','acquire'].includes(scope))throw Error('Invalid strategy');
    this.strategy=strategy;this.scope=scope;this.forks=Array(5).fill(null);this.gate=null;this.tick=0;this.cursor=0;this.seed=2026;this.maxEating=0;this.history=[];
    this.people=Array.from({length:5},(_,id)=>({id,pc:0,phase:'thinking',waiting:null,meals:0}));
  }
  program(){return ['hungry',...(this.strategy==='central'?['gate']:[]),'first','second',...(this.strategy==='central'&&this.scope==='acquire'?['ungate']:[]),'eat','releaseSecond','releaseFirst',...(this.strategy==='central'&&this.scope==='meal'?['ungate']:[]),'think'];}
  order(id){const a=[id,(id+1)%5];return this.strategy==='ordered'?a.sort((x,y)=>x-y):a;}
  action(id){return this.program()[this.people[id].pc];}
  resource(id){const action=this.action(id),[a,b]=this.order(id);return action==='gate'?'M':action==='first'?'G'+a:action==='second'?'G'+b:null;}
  owner(resource){return resource==='M'?this.gate:this.forks[Number(resource.slice(1))];}
  waitingEdges(){return this.people.filter(p=>p.waiting&&this.owner(p.waiting)!==null).map(p=>({from:p.id,to:this.owner(p.waiting),resource:p.waiting}));}
  cycle(){const edges=this.waitingEdges(),next=new Map(edges.map(e=>[e.from,e.to]));for(let start=0;start<5;start++){let trail=[],at=start;while(next.has(at)){if(trail.includes(at))return trail.slice(trail.indexOf(at));trail.push(at);at=next.get(at);}}return [];}
  runnable(){return this.people.filter(p=>!p.waiting||this.owner(p.waiting)===null).map(p=>p.id);}
  choose(mode='round'){const candidates=this.runnable();if(!candidates.length)return null;if(mode==='random'){this.seed=(Math.imul(1664525,this.seed)+1013904223)>>>0;return candidates[this.seed%candidates.length];}for(let n=0;n<5;n++){const id=(this.cursor+n)%5;if(candidates.includes(id)){this.cursor=(id+1)%5;return id;}}return null;}
  step(id){
    if(!Number.isInteger(id)||id<0||id>4)throw Error('Invalid philosopher');
    const p=this.people[id],action=this.action(id),resource=this.resource(id);this.tick++;
    let event={tick:this.tick,id,action,kind:action,resource};
    if(resource){const owner=this.owner(resource);if(owner!==null){p.waiting=resource;event.kind='wait';event.owner=owner;}else{if(resource==='M')this.gate=id;else this.forks[Number(resource.slice(1))]=id;p.waiting=null;event.kind='lock';p.pc++;}}
    else {p.waiting=null;if(action==='hungry')p.phase='hungry';if(action==='eat'){p.phase='eating';p.meals++;}if(action==='releaseSecond'||action==='releaseFirst'){const index=this.order(id)[action==='releaseFirst'?0:1];if(this.forks[index]!==id)throw Error('Unlock without ownership');this.forks[index]=null;p.phase='releasing';event.resource='G'+index;event.kind='unlock';}if(action==='ungate'){if(this.gate!==id)throw Error('Gate ownership');this.gate=null;event.resource='M';event.kind='unlock';}p.pc++;if(action==='think'){p.phase='thinking';p.pc=0;}}
    this.people.forEach(q=>{if(q.waiting&&this.owner(q.waiting)===null)q.waiting=null;});
    this.maxEating=Math.max(this.maxEating,this.people.filter(q=>q.phase==='eating').length);
    this.assertInvariants();this.history.push(event);if(this.history.length>120)this.history.shift();return event;
  }
  assertInvariants(){
    for(const p of this.people){const owned=this.forks.map((v,i)=>v===p.id?i:-1).filter(i=>i>=0);if(owned.some(i=>!this.order(p.id).includes(i)))throw Error('Non-adjacent fork');if(p.phase==='eating'&&owned.length!==2)throw Error('Eating without two forks');if(p.phase==='eating'&&this.people[(p.id+1)%5].phase==='eating')throw Error('Neighbors eating');if(this.strategy==='ordered'&&owned.length===1&&this.action(p.id)==='second'&&owned[0]!==this.order(p.id)[0])throw Error('Resource order');}
    if(this.strategy==='central'&&this.scope==='meal'&&this.people.filter(p=>p.phase==='eating').length>1)throw Error('Global mutex parallelism');
  }
  allHungry(){this.reset();for(let i=0;i<5;i++)this.step(i);this.cursor=0;}
}
if(typeof window!=='undefined')window.DiningSimulation=DiningSimulation;
</script>
<script id="simulation-ui">'use strict';
const messages = {"title":["O jantar dos filósofos","The dining philosophers","La cena de los filósofos"],"eyebrow":["CONCORRÊNCIA · MUTEXES","CONCURRENCY · MUTEXES","CONCURRENCIA · MUTEXES"],"intro":["Cinco filósofos, cinco garfos. Explore como a ordem das travas muda o destino do jantar.","Five philosophers, five forks. Explore how lock ordering changes the outcome of dinner.","Cinco filósofos, cinco tenedores. Explora cómo el orden de bloqueo cambia el resultado de la cena."],"stepCount":["Passos","Steps","Pasos"],"totalMeals":["Refeições iniciadas","Meals started","Comidas iniciadas"],"parallel":["Máximo comendo juntos","Peak concurrent diners","Máximo comiendo a la vez"],"strategy":["Estratégia","Strategy","Estrategia"],"naive":["1 · Ingênua","1 · Naive","1 · Ingenua"],"central":["2 · Mutex central","2 · Central mutex","2 · Mutex central"],"ordered":["3 · Ordem dos garfos","3 · Fork ordering","3 · Orden de tenedores"],"scope":["Abrangência do mutex central","Central mutex scope","Alcance del mutex central"],"meal":["Toda a refeição · slide 8","Entire meal · slide 8","Toda la comida · diapositiva 8"],"acquire":["Aquisição dos garfos · slide 9","Fork acquisition · slide 9","Adquisición de tenedores · diapositiva 9"],"scheduler":["Escalonamento","Scheduling","Planificación"],"round":["Alternado (round-robin)","Round-robin","Por turnos (round-robin)"],"random":["Pseudoaleatório","Pseudorandom","Pseudoaleatorio"],"manual":["Manual","Manual","Manual"],"speed":["Intervalo entre passos","Step interval","Intervalo entre pasos"],"play":["▶ Executar","▶ Run","▶ Ejecutar"],"pause":["Ⅱ Pausar","Ⅱ Pause","Ⅱ Pausar"],"step":["Próximo passo →","Next step →","Siguiente paso →"],"reset":["↺ Reiniciar","↺ Reset","↺ Reiniciar"],"hungryScenario":["Todos com fome","Everyone hungry","Todos con hambre"],"concurrentScenario":["Mostrar P0 e P2","Show P0 and P2","Mostrar P0 y P2"],"scenarioHelp":["“Todos com fome” prepara a mesma condição inicial para comparar estratégias. Avance ou execute para acompanhar as aquisições.","“Everyone hungry” sets the same initial condition for comparing strategies. Step or run to follow the acquisitions.","“Todos con hambre” prepara la misma condición inicial para comparar estrategias. Avanza o ejecuta para seguir las adquisiciones."],"diagram":["A mesa em execução","The table in action","La mesa en ejecución"],"clickHelp":["Clique em um filósofo para inspecionar sua próxima instrução.","Click a philosopher to inspect their next instruction.","Haz clic en un filósofo para inspeccionar su siguiente instrucción."],"table":["MESA","TABLE","MESA"],"forks":["Garfos","Forks","Tenedores"],"free":["livre","free","libre"],"owner":["com P{0}","held by P{0}","en P{0}"],"thinking":["Pensando","Thinking","Pensando"],"hungry":["Com fome","Hungry","Con hambre"],"waiting":["Bloqueado","Blocked","Bloqueado"],"ready":["Dois garfos","Two forks","Dos tenedores"],"eating":["Comendo","Eating","Comiendo"],"releasing":["Devolvendo","Releasing","Devolviendo"],"gateLabel":["Mutex central M","Central mutex M","Mutex central M"],"unused":["não utilizado","not used","no utilizado"],"selected":["Filósofo selecionado","Selected philosopher","Filósofo seleccionado"],"runPerson":["Executar 1 instrução de P{0}","Run 1 instruction of P{0}","Ejecutar 1 instrucción de P{0}"],"nextInstruction":["Próxima instrução","Next instruction","Siguiente instrucción"],"order":["Ordem de aquisição: G{0} → G{1}","Acquisition order: G{0} → G{1}","Orden de adquisición: G{0} → G{1}"],"pseudo":["Código equivalente em C / Pthreads","Equivalent C / Pthreads code","Código equivalente en C / Pthreads"],"highlightHelp":["A linha marcada é a próxima instrução de P{0}. Cada passo executa uma instrução de uma thread.","The highlighted line is P{0}’s next instruction. Each step executes one thread instruction.","La línea resaltada es la siguiente instrucción de P{0}. Cada paso ejecuta una instrucción de un hilo."],"stateLabel":["Estado","State","Estado"],"held":["Em posse","Held","En posesión"],"none":["nenhum","none","ninguno"],"blockedBy":["P{0} aguarda {1}, retido por P{2}.","P{0} waits for {1}, held by P{2}.","P{0} espera {1}, retenido por P{2}."],"waitGraph":["Quem espera por quem","Who waits for whom","Quién espera a quién"],"noWait":["Nenhuma thread bloqueada neste instante.","No threads are blocked right now.","Ningún hilo está bloqueado en este instante."],"edgeMeaning":["Pᵢ → Pⱼ significa que Pᵢ espera um mutex retido por Pⱼ.","Pᵢ → Pⱼ means Pᵢ waits for a mutex held by Pⱼ.","Pᵢ → Pⱼ significa que Pᵢ espera un mutex retenido por Pⱼ."],"deadlock":["DEADLOCK DETECTADO","DEADLOCK DETECTED","DEADLOCK DETECTADO"],"deadlockDesc":["Há um ciclo de espera. Nenhum filósofo no ciclo consegue alcançar as instruções de liberação. Reinicie ou troque a estratégia.","There is a wait cycle. No philosopher in the cycle can reach the unlock instructions. Reset or change the strategy.","Hay un ciclo de espera. Ningún filósofo del ciclo puede alcanzar las instrucciones de liberación. Reinicia o cambia de estrategia."],"running":["Execução em andamento","Simulation running","Ejecución en curso"],"paused":["Pronto para avançar","Ready to step","Listo para avanzar"],"waitingNotice":["Espera não é deadlock","Waiting is not deadlock","Esperar no es deadlock"],"waitingDesc":["Há threads bloqueadas, mas não há ciclo. Quem possui os recursos ainda pode avançar e liberá-los.","Some threads are blocked, but there is no cycle. Resource owners can still advance and release them.","Hay hilos bloqueados, pero no hay ciclo. Quienes poseen los recursos aún pueden avanzar y liberarlos."],"safeDesc":["Acompanhe as travas, a posse dos garfos e as próximas instruções.","Follow the locks, fork ownership and next instructions.","Observa los bloqueos, la posesión de los tenedores y las siguientes instrucciones."],"log":["Histórico de instruções","Instruction history","Historial de instrucciones"],"logEmpty":["A simulação está pronta. Execute um passo para começar.","The simulation is ready. Execute a step to start.","La simulación está lista. Ejecuta un paso para comenzar."],"eventHungry":["P{0} ficou com fome.","P{0} became hungry.","P{0} tiene hambre."],"eventLock":["P{0} adquiriu {1}.","P{0} acquired {1}.","P{0} adquirió {1}."],"eventWait":["P{0} bloqueou em {1} (com P{2}).","P{0} blocked on {1} (held by P{2}).","P{0} se bloqueó en {1} (en P{2})."],"eventUnlock":["P{0} liberou {1}.","P{0} released {1}.","P{0} liberó {1}."],"eventEat":["P{0} começou a comer com os dois garfos.","P{0} started eating with both forks.","P{0} empezó a comer con los dos tenedores."],"eventThink":["P{0} voltou a pensar.","P{0} returned to thinking.","P{0} volvió a pensar."],"lesson":["O que esta estratégia ensina","What this strategy teaches","Qué enseña esta estrategia"],"naiveLesson":["Cada filósofo pega primeiro Gᵢ e depois G₍ᵢ₊₁₎ mod 5. Se todos retiverem o primeiro garfo, cada um aguardará o vizinho: o ciclo fecha. O deadlock é possível, mas não acontece em toda execução.","Each philosopher takes Gᵢ first, then G₍ᵢ₊₁₎ mod 5. If all hold their first fork, each waits for their neighbor: a cycle forms. Deadlock is possible, but does not occur on every execution.","Cada filósofo toma primero Gᵢ y después G₍ᵢ₊₁₎ mod 5. Si todos retienen el primero, cada uno espera a su vecino: se cierra el ciclo. El deadlock es posible, pero no ocurre en toda ejecución."],"mealLesson":["O mutex M fica retido da aquisição até a devolução dos garfos. Só um filósofo pode comer por vez, mesmo que outro não compartilhe seus garfos. Evita deadlock por serialização.","Mutex M is held from acquisition through fork release. Only one philosopher can eat at a time, even when another does not share their forks. Serialization prevents deadlock.","El mutex M se retiene desde la adquisición hasta devolver los tenedores. Solo un filósofo puede comer a la vez, aunque otro no comparta sus tenedores. La serialización evita el deadlock."],"acquireLesson":["O garçom M protege somente a aquisição dos dois garfos e é liberado antes de comer. Um solicitante pode esperar um garfo segurando M; quem já está comendo pode devolver seus garfos sem precisar de M. P0 e P2 podem comer juntos.","Waiter M protects only acquisition of both forks and is released before eating. A requester may wait for a fork while holding M; an existing diner can release forks without M. P0 and P2 can eat together.","El camarero M protege solo la adquisición de ambos tenedores y se libera antes de comer. Un solicitante puede esperar un tenedor reteniendo M; quien ya come puede devolver sus tenedores sin M. P0 y P2 pueden comer juntos."],"orderedLesson":["Todo filósofo adquire o garfo de menor índice antes do maior. Em especial, P4 solicita G0 antes de G4. As dependências de recursos seguem índices crescentes e não fecham um ciclo. Filósofos não vizinhos ainda podem comer juntos.","Every philosopher acquires the lower-index fork before the higher one. In particular, P4 requests G0 before G4. Resource dependencies follow increasing indices and cannot form a cycle. Non-neighbors can still eat together.","Cada filósofo adquiere el tenedor de menor índice antes del mayor. En particular, P4 solicita G0 antes de G4. Las dependencias siguen índices crecientes y no cierran un ciclo. Los no vecinos aún pueden comer juntos."],"fairness":["Sem deadlock não significa sem inanição: estas soluções com mutexes não estabelecem uma fila justa. Uma execução finita não prova ausência de inanição.","Deadlock freedom does not imply starvation freedom: these mutex solutions do not establish a fair queue. A finite run cannot prove starvation freedom.","La ausencia de deadlock no implica ausencia de inanición: estas soluciones con mutexes no establecen una cola justa. Una ejecución finita no prueba ausencia de inanición."],"model":["Modelo didático: cada passo representa uma instrução de uma thread, com lock/unlock atômicos. Um lock ocupado bloqueia a thread sem retirar o recurso do dono. O escalonador alternado pula threads bloqueadas; o manual permite escolher quem avança.","Teaching model: each step represents one thread instruction, with atomic lock/unlock. A busy lock blocks the thread without taking the resource from its owner. Round-robin skips blocked threads; manual mode lets you choose who advances.","Modelo didáctico: cada paso representa una instrucción de un hilo, con lock/unlock atómicos. Un lock ocupado bloquea el hilo sin quitar el recurso a su dueño. La planificación por turnos omite hilos bloqueados; el modo manual permite elegir quién avanza."],"source":["Base: slides “O Jantar dos Filósofos”, pp. 8–9, 12 e 16–17.","Based on “O Jantar dos Filósofos” slides, pp. 8–9, 12 and 16–17.","Basado en las diapositivas “O Jantar dos Filósofos”, pp. 8–9, 12 y 16–17."],"coffman":["Condições de Coffman","Coffman conditions","Condiciones de Coffman"],"exclusion":["Exclusão mútua","Mutual exclusion","Exclusión mutua"],"holdWait":["Posse e espera","Hold and wait","Retención y espera"],"noPreempt":["Sem preempção","No preemption","Sin expropiación"],"circular":["Espera circular","Circular wait","Espera circular"],"possible":["possível","possible","posible"],"prevented":["impedida pela estratégia","prevented by strategy","impedida por la estrategia"],"present":["presente agora","present now","presente ahora"],"allowed":["permitida no modelo","allowed by model","permitida en el modelo"],"selectedHint":["Para escolher exatamente a próxima thread, use o modo Manual.","Use Manual mode to choose the next thread explicitly.","Utiliza el modo Manual para elegir el siguiente hilo."],"centralComparison":["Slide 8: trava durante toda a refeição. Slide 9: trava somente ao pegar os garfos. Essas variantes têm paralelismo diferente.","Slide 8 locks the entire meal. Slide 9 locks only fork acquisition. These variants have different parallelism.","La diapositiva 8 bloquea toda la comida. La 9 bloquea solo la adquisición. Estas variantes tienen distinto paralelismo."],"concurrentMeal":["P0 come enquanto P2 aguarda M. Com a trava da refeição, não há duas refeições simultâneas.","P0 eats while P2 waits for M. Holding the meal lock prevents simultaneous meals.","P0 come mientras P2 espera M. Con el bloqueo de toda la comida no hay comidas simultáneas."],"concurrentOk":["P0 e P2 estão comendo juntos: não compartilham garfos.","P0 and P2 are eating together: they share no forks.","P0 y P2 comen a la vez: no comparten tenedores."],"scenarioNote":["Cenário preparado","Scenario prepared","Escenario preparado"],"language":["Idioma","Language","Idioma"],"personMeals":["refeições","meals","comidas"],"initialized":["N = 5; mutexes inicializados antes das threads","N = 5; mutexes initialized before threads","N = 5; mutexes inicializados antes de los hilos"],"advanceOwner":["Thread bloqueada: avance o filósofo que possui o recurso.","Thread blocked: advance the philosopher that owns the resource.","Hilo bloqueado: avanza el filósofo que posee el recurso."],"absent":["não observada agora","not observed now","no observada ahora"]};
let lang='pt', selected=0, timer=null, playing=false, noteKey=null;
const simulation=new DiningSimulation();
const $=id=>document.getElementById(id);
const t=(key,...args)=>messages[key][{pt:0,en:1,es:2}[lang]].replace(/\{(\d+)\}/g,(_,i)=>String(args[Number(i)]));
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colours=['#3675ba','#ad6a39','#7c5eae','#0d8a78','#b14f70'];
function stateOf(p){if(p.waiting!==null&&simulation.owner(p.waiting)!==null)return 'waiting';if(p.phase==='hungry'&&simulation.forks.filter(v=>v===p.id).length===2)return 'ready';return p.phase;}
function stop(){clearTimeout(timer);timer=null;playing=false;}
function reset(){stop();simulation.reset(simulation.strategy,$('scope').value);selected=0;noteKey=null;render();}
function act(id){if(simulation.cycle().length||stateOf(simulation.people[id])==='waiting')return;selected=id;simulation.step(id);noteKey=null;if(simulation.cycle().length)stop();render();}
function advance(){const id=$('scheduler').value==='manual'?selected:simulation.choose($('scheduler').value);if(id===null){stop();render();return;}act(id);}
function loop(){if(!playing)return;advance();if(playing)timer=setTimeout(loop,Number($('speed').value));}
function setLanguage(value){lang=value;document.documentElement.lang=lang==='pt'?'pt-BR':lang;document.title=t('title')+' — Mutexes';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===lang)));document.querySelector('.languages').setAttribute('aria-label',t('language'));render();}
function codeLines(){
 const central=simulation.strategy==='central',ordered=simulation.strategy==='ordered',meal=simulation.scope==='meal';
 const lines=[['','// '+t('initialized')],['','int e = id, d = (id + 1) % N;']];
 if(ordered){lines.push(['','int primeiro = (e < d) ? e : d;'],['','int segundo  = (e < d) ? d : e;']);}
 const first=ordered?'primeiro':'e',second=ordered?'segundo':'d';
 lines.push(['','while (true) {'],['hungry','  pensar(id); // '+t('hungry')]);
 if(central)lines.push(['gate','  pthread_mutex_lock(&M);']);
 lines.push(['first','  pthread_mutex_lock(&garfos['+first+']);'],['second','  pthread_mutex_lock(&garfos['+second+']);']);
 if(central&&!meal)lines.push(['ungate','  pthread_mutex_unlock(&M);']);
 lines.push(['eat','  faz_refeicao(id);'],['releaseSecond','  pthread_mutex_unlock(&garfos['+second+']);'],['releaseFirst','  pthread_mutex_unlock(&garfos['+first+']);']);
 if(central&&meal)lines.push(['ungate','  pthread_mutex_unlock(&M);']);
 lines.push(['think','  // '+t('thinking')+' → ...'],['','}']);return lines;
}
function renderCode(){const p=simulation.people[selected],action=simulation.action(selected);$('code').innerHTML=codeLines().map(([id,line],index)=>'<span class="code-line '+(id===action?'active ':'')+(id===action&&stateOf(p)==='waiting'?'blocked':'')+'"><span class="num">'+(index+1)+'</span>'+escapeHTML(line)+'</span>').join('');$('code-caption').textContent=t('highlightHelp',selected);const line=codeLines().find(([id])=>id===action)?.[1]||action;$('next-instruction').textContent=simulation.cycle().length?t('deadlockDesc'):stateOf(p)==='waiting'?t('advanceOwner'):t('nextInstruction')+': '+line.trim();}
function position(index,radius,offset=-90){const a=(index*72+offset)*Math.PI/180;return {x:320+radius*Math.cos(a),y:285+radius*Math.sin(a)};}
function renderTable(){
 const people=simulation.people,ph=people.map((_,i)=>position(i,215)),fork=people.map((_,i)=>position(i,149,-126)),last=simulation.history.at(-1),cycle=simulation.cycle();
 let svg='<defs><marker id="wait-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#bd3346"/></marker></defs>';
 svg+='<circle cx="320" cy="285" r="155" fill="#f6f9f7" stroke="#e1eae4" stroke-width="2"/><circle cx="320" cy="285" r="112" fill="#edf4ee" stroke="#d8e5dc"/><text x="320" y="263" text-anchor="middle" fill="#739083" font-size="11" font-weight="800" letter-spacing="3">'+escapeHTML(t('table'))+'</text>';
 const gateText=simulation.strategy==='central'?(simulation.gate===null?t('free'):'P'+simulation.gate):t('unused');
 svg+='<rect x="245" y="283" width="150" height="54" rx="12" fill="'+(simulation.gate===null?'#fff':'#d8e9df')+'" stroke="#d3e1d6"/><text x="320" y="303" text-anchor="middle" fill="#537065" font-size="10">'+escapeHTML(t('gateLabel'))+'</text><text x="320" y="323" text-anchor="middle" fill="#203f32" font-size="14" font-weight="750">'+escapeHTML(gateText)+'</text>';
 simulation.forks.forEach((owner,i)=>{if(owner!==null)svg+='<line class="fork-line" x1="'+fork[i].x+'" y1="'+fork[i].y+'" x2="'+ph[owner].x+'" y2="'+ph[owner].y+'" stroke="'+colours[owner]+'" stroke-width="6"/>';});
 simulation.waitingEdges().forEach(edge=>{const p=ph[edge.from],target=edge.resource==='M'?{x:320,y:310}:fork[Number(edge.resource.slice(1))],dx=target.x-p.x,dy=target.y-p.y,length=Math.hypot(dx,dy),sx=p.x+dx/length*50,sy=p.y+dy/length*50,ex=target.x-dx/length*29,ey=target.y-dy/length*29;svg+='<path class="wait-line" marker-end="url(#wait-arrow)" d="M '+sx+' '+sy+' Q '+((sx+ex)/2+15)+' '+((sy+ey)/2-8)+' '+ex+' '+ey+'"/>';});
 fork.forEach((pos,i)=>{const owner=simulation.forks[i],active=last&&last.resource==='G'+i;svg+='<g class="'+(active?'flash':'')+'"><rect x="'+(pos.x-31)+'" y="'+(pos.y-23)+'" width="62" height="46" rx="12" fill="'+(owner===null?'white':colours[owner]+'20')+'" stroke="'+(owner===null?'#c9d8cf':colours[owner])+'" stroke-width="2"/><text class="fork-label" x="'+pos.x+'" y="'+(pos.y-2)+'" text-anchor="middle">G'+i+'</text><text class="fork-owner" x="'+pos.x+'" y="'+(pos.y+14)+'" text-anchor="middle">'+escapeHTML(owner===null?t('free'):'P'+owner)+'</text></g>';});
 ph.forEach((pos,i)=>{const p=people[i],state=stateOf(p),fill=state==='eating'?'#c9eedb':state==='waiting'?'#fbe0e4':state==='thinking'?'#e4ece8':'#fceacb',stroke=cycle.includes(i)?'#bd3346':colours[i];svg+='<g class="philosopher" data-person="'+i+'" tabindex="0" role="button" aria-label="P'+i+' · '+escapeHTML(t(state))+'" aria-pressed="'+(selected===i)+'">'+(selected===i?'<circle class="selected-ring" cx="'+pos.x+'" cy="'+pos.y+'" r="49"/>':'')+'<circle class="avatar" cx="'+pos.x+'" cy="'+pos.y+'" r="42" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/><text class="person-name" x="'+pos.x+'" y="'+(pos.y+7)+'" text-anchor="middle">P'+i+'</text><text class="person-state" x="'+pos.x+'" y="'+(pos.y+65)+'" text-anchor="middle" fill="'+(state==='waiting'?'#bd3346':'#294c42')+'">'+escapeHTML(t(state))+'</text><text class="person-meals" x="'+pos.x+'" y="'+(pos.y+82)+'" text-anchor="middle">'+p.meals+' '+escapeHTML(t('personMeals'))+'</text></g>';});
 $('table').innerHTML=svg;$('table').setAttribute('aria-label',t('diagram'));
}
function eventText(e){if(e.kind==='lock')return t('eventLock',e.id,e.resource);if(e.kind==='wait')return t('eventWait',e.id,e.resource,e.owner);if(e.kind==='unlock')return t('eventUnlock',e.id,e.resource);if(e.kind==='eat')return t('eventEat',e.id);if(e.kind==='hungry')return t('eventHungry',e.id);return t('eventThink',e.id);}
function render(){
 const cycle=simulation.cycle(),edges=simulation.waitingEdges(),p=simulation.people[selected],isManual=$('scheduler').value==='manual';
 $('ticks').textContent=simulation.tick;$('meals').textContent=simulation.people.reduce((a,p)=>a+p.meals,0);$('peak').textContent=simulation.maxEating;
 $('scope-control').hidden=simulation.strategy!=='central';$('central-comparison').hidden=simulation.strategy!=='central';
 document.querySelectorAll('[data-strategy]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.strategy===simulation.strategy)));
 $('play').textContent=t(playing?'pause':'play');$('play').disabled=isManual||cycle.length>0;$('step').disabled=cycle.length>0||(isManual&&stateOf(p)==='waiting');$('person-step').disabled=!isManual||cycle.length>0||stateOf(p)==='waiting';$('person-step').textContent=t('runPerson',selected);$('person-step').title=stateOf(p)==='waiting'?t('advanceOwner'):isManual?'':t('selectedHint');$('step').title=isManual&&stateOf(p)==='waiting'?t('advanceOwner'):'';
 $('people-buttons').innerHTML=simulation.people.map(p=>'<button type="button" data-person="'+p.id+'" aria-pressed="'+(selected===p.id)+'">P'+p.id+'</button>').join('');
 $('selected-tag').textContent='P'+selected;const [a,b]=simulation.order(selected);$('order').textContent=t('order',a,b);$('person-state').textContent=t(stateOf(p));$('person-held').textContent=[...simulation.forks.map((v,i)=>v===selected?'G'+i:null).filter(Boolean),...(simulation.gate===selected?['M']:[])].join(', ')||t('none');
 $('lesson-text').textContent=t(simulation.strategy==='central'?simulation.scope+'Lesson':simulation.strategy+'Lesson');
 $('wait-list').innerHTML=edges.length?edges.map(e=>'<div class="wait-row"><b>P'+e.from+' → P'+e.to+'</b> · '+escapeHTML(t('blockedBy',e.from,e.resource,e.to))+'</div>').join(''):'<p class="caption">'+escapeHTML(t('noWait'))+'</p>';
 $('cycle').textContent=cycle.length?[...cycle,cycle[0]].map(i=>'P'+i).join(' → '):'';
 $('status').className='status-banner'+(cycle.length?' danger':edges.length?' warning':'');$('status-title').textContent=t(cycle.length?'deadlock':edges.length?'waitingNotice':playing?'running':'paused');$('status-description').textContent=t(cycle.length?'deadlockDesc':edges.length?'waitingDesc':'safeDesc');
 const hold=simulation.people.some(p=>p.waiting&&(simulation.forks.includes(p.id)||simulation.gate===p.id));
 $('conditions').innerHTML=[['exclusion','present'],['holdWait',hold?'present':'absent'],['noPreempt','present'],['circular',cycle.length?'present':simulation.strategy==='naive'?'possible':'prevented']].map(([key,value])=>'<div class="condition '+(key==='circular'&&cycle.length?'bad':'')+'"><b>'+escapeHTML(t(key))+'</b><small>'+escapeHTML(t(value))+'</small></div>').join('');
 $('log').innerHTML=simulation.history.length?simulation.history.slice(-40).reverse().map(e=>'<li class="'+e.kind+'"><span class="tick">#'+e.tick+'</span><span>'+escapeHTML(eventText(e))+'</span></li>').join(''):'<li>'+escapeHTML(t('logEmpty'))+'</li>';
 $('scenario-note').hidden=!noteKey;if(noteKey)$('scenario-note').textContent=t(noteKey);renderCode();renderTable();
}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.lang)));
document.querySelectorAll('[data-strategy]').forEach(button=>button.addEventListener('click',()=>{stop();simulation.reset(button.dataset.strategy,$('scope').value);selected=0;noteKey=null;render();}));
$('scope').addEventListener('change',reset);$('scheduler').addEventListener('change',()=>{stop();render();});
$('speed').addEventListener('input',()=>{$('speed-value').textContent=$('speed').value+' ms';});
$('play').addEventListener('click',()=>{if(playing){stop();render();}else{playing=true;loop();}});
$('step').addEventListener('click',()=>{stop();advance();});$('person-step').addEventListener('click',()=>{stop();act(selected);});$('reset').addEventListener('click',reset);
$('hungry-scenario').addEventListener('click',()=>{stop();simulation.allHungry();selected=0;noteKey='scenarioHelp';render();});
$('concurrent-scenario').addEventListener('click',()=>{stop();simulation.reset();for(const id of [0,2])for(let n=0;n<12;n++){simulation.step(id);const p=simulation.people[id];if(p.phase==='eating'||p.waiting)break;}selected=2;noteKey=simulation.strategy==='central'&&simulation.scope==='meal'?'concurrentMeal':'concurrentOk';render();});
function selectPerson(event){const element=event.target.closest('[data-person]');if(element){selected=Number(element.dataset.person);render();}}
$('table').addEventListener('click',selectPerson);$('table').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPerson(event);}});$('people-buttons').addEventListener('click',selectPerson);
window.addEventListener('pagehide',stop);setLanguage('pt');
</script>
<script data-mobile-visual>
(() => {
  const svg=document.getElementById('table');
  const region=document.createElement('div');region.className='mobile-visual-scroll';region.dataset.zoomed='false';region.tabIndex=0;region.setAttribute('role','region');
  svg.before(region);region.append(svg);
  const controls=document.createElement('div');controls.className='mobile-visual-controls';
  const button=document.createElement('button');button.type='button';
  const hint=document.createElement('span');hint.className='mobile-scroll-hint';hint.setAttribute('aria-hidden','true');controls.append(button,hint);region.before(controls);
  const labels={pt:['Ver diagrama inteiro','Ampliar para leitura','Diagrama ampliado: deslize horizontalmente'],es:['Ver el diagrama completo','Ampliar para leer','Diagrama ampliado: desliza horizontalmente'],en:['Show entire diagram','Enlarge for reading','Enlarged diagram: swipe horizontally']};
  function refresh(){const words=labels[document.documentElement.lang.slice(0,2)]||labels.pt;button.textContent=words[region.dataset.zoomed==='true'?0:1];button.setAttribute('aria-expanded',String(region.dataset.zoomed==='true'));region.setAttribute('aria-label',region.dataset.zoomed==='true'?words[2]:(svg.getAttribute('aria-label')||words[2]));hint.hidden=region.dataset.zoomed!=='true';}
  button.addEventListener('click',()=>{region.dataset.zoomed=String(region.dataset.zoomed!=='true');refresh();});
  new MutationObserver(refresh).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});refresh();
})();
</script>
</body></html>
